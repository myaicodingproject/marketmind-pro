# GitHub Actions workflow for MarketMind Pro testing
name: MarketMind Pro Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  COVERAGE_THRESHOLD: 80

jobs:
  # Linting and code quality
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        pip install -r requirements.txt
    
    - name: Run flake8
      run: flake8 app backend/app --max-line-length=100 --ignore=E203,W503
    
    - name: Run black
      run: black --check app backend/app
    
    - name: Run isort
      run: isort --check-only app backend/app
    
    - name: Run mypy
      run: mypy app backend/app --ignore-missing-imports

  # Backend unit tests
  backend-tests:
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/tests/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      run: |
        export DATABASE_URL="postgresql://postgres:testpassword@localhost:5432/testdb"
        export REDIS_URL="redis://localhost:6379/1"
        export ENVIRONMENT="test"
    
    - name: Run backend unit tests
      run: |
        pytest tests/backend/ \
          -v \
          --cov=app \
          --cov=backend/app \
          --cov-report=xml \
          --cov-report=html \
          --junit-xml=test-results/backend-results.xml \
          -m "not integration and not performance" \
          --maxfail=10
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          test-results/
          htmlcov/

  # Frontend tests
  frontend-tests:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run frontend tests
      working-directory: ./frontend
      run: |
        npm test -- --coverage --watchAll=false --testResultsProcessor=jest-junit
      env:
        CI: true
    
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
    
    - name: Upload frontend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
          frontend/junit.xml

  # Integration tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Start application
      run: |
        export DATABASE_URL="postgresql://postgres:testpassword@localhost:5432/testdb"
        export REDIS_URL="redis://localhost:6379/1"
        export ENVIRONMENT="test"
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          -v \
          --junit-xml=test-results/integration-results.xml \
          -m "integration" \
          --maxfail=5
      env:
        DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/testdb"
        REDIS_URL: "redis://localhost:6379/1"
        API_BASE_URL: "http://localhost:8000"
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  # Performance tests (only on schedule or manual trigger)
  performance-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Start application
      run: |
        export DATABASE_URL="postgresql://postgres:testpassword@localhost:5432/testdb"
        export REDIS_URL="redis://localhost:6379/1"
        export ENVIRONMENT="test"
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Run performance tests
      run: |
        pytest tests/performance/ \
          -v \
          --junit-xml=test-results/performance-results.xml \
          -m "performance" \
          --timeout=300
      env:
        DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/testdb"
        REDIS_URL: "redis://localhost:6379/1"
        API_BASE_URL: "http://localhost:8000"
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: test-results/

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r app backend/app -f json -o bandit-report.json || true
    
    - name: Run Safety check
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-scan-results
        path: |
          bandit-report.json
          safety-report.json

  # Test summary and reporting
  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests]
    if: always()
    
    steps:
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Generate test summary
      run: |
        echo "# Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Backend tests
        if [ -f "backend-test-results/backend-results.xml" ]; then
          echo "## Backend Tests ✅" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Backend Tests ❌" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Frontend tests
        if [ -f "frontend-test-results/junit.xml" ]; then
          echo "## Frontend Tests ✅" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Frontend Tests ❌" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Integration tests
        if [ -f "integration-test-results/integration-results.xml" ]; then
          echo "## Integration Tests ✅" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Integration Tests ❌" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed results in the artifacts section." >> $GITHUB_STEP_SUMMARY

  # Deployment readiness check
  deployment-check:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Check deployment readiness
      run: |
        echo "All tests passed! Ready for deployment."
        echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV
    
    - name: Trigger deployment
      if: env.DEPLOYMENT_READY == 'true'
      run: |
        echo "Triggering deployment workflow..."
        # This would trigger your deployment workflow